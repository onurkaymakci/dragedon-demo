function setDecorWall(anchor,side,u,y){
 if(!wallParents[side])return;
 anchor.userData.side=side;
 // Duvar yönü her seferinde mutlak olarak hesaplanır: önceki transferin yönü birikmez.

 const height=THREE.MathUtils.clamp(y,.9,3.65);

 if(side==='back')anchor.position.set(along,height,-ROOM_HALF_Z+depth);

 if(side==='left')anchor.position.set(-ROOM_HALF_X+depth,height,along);
 if(side==='right')anchor.position.set(ROOM_HALF_X-depth,height,along);
}
function decor(name,side,x,y){

 const modelRoot=new THREE.Group();
 modelRoot.rotation.y=-wallFacing[side];
 anchor.add(modelRoot);
 setDecorWall(anchor,side,x,y);
 wallDecor.push(anchor);
 return modelRoot;
}

let babyStage='baby'; // İleride genç/erişkin evrelere genişletilecek.

// Eski kayıtta dolap duvara ters bakıyorsa açılışta yönünü bir kez düzelt.

// Oda sınırları ve mobilya çevresinde basit ızgara yol bulma
const PET_RADIUS=.55,GRID=.30,MIN_X=-4.95,MAX_X=4.95,MIN_Z=-4.45,MAX_Z=4.45;
function petCellFree(x,z){
  if(x<MIN_X||x>MAX_X||z<MIN_Z||z>MAX_Z)return false;
  return !furniture.some(f=>{
    if(f.userData.name==='rug')return false;
    const s=footprint(f);
    return Math.abs(x-f.position.x)<s[0]/2+PET_RADIUS &&
      Math.abs(z-f.position.z)<s[1]/2+PET_RADIUS;
  });
}
// Başlangıç ve kaydedilmiş oda düzeni kontrolü: Mochi hiçbir eşyanın içinde doğmasın.
function ensurePetSafeSpawn(){
  if(petCellFree(pet.position.x,pet.position.z))return;
  const originX=pet.position.x,originZ=pet.position.z;
  let best=null,bestScore=Infinity;
  for(let x=MIN_X;x<=MAX_X;x+=.25){
    for(let z=MIN_Z;z<=MAX_Z;z+=.25){
      if(!petCellFree(x,z))continue;
      // Yakın ve kameradan görülebilen merkezi noktalar öncelikli.
      const score=Math.hypot(x-originX,z-originZ)+.1*Math.abs(x)+.04*Math.abs(z);
      if(score<bestScore){best={x,z};bestScore=score}
    }
  }
  if(best){pet.position.x=best.x;pet.position.z=best.z;petRoute=[];petTarget.set(best.x,.13,best.z)}
}
ensurePetSafeSpawn();
function clearPetSegment(a,b){
 const distance=Math.hypot(b.x-a.x,b.z-a.z);
 const steps=Math.max(1,Math.ceil(distance/.13));
 for(let i=1;i<=steps;i++){
  const t=i/steps;
  if(!petCellFree(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t))return false;
 }
 return true;
}
function planPetRoute(x,z){
 // Hedef doğrudan görülebiliyorsa ızgara kullanılmaz: düz çizgide git.
 const startPos={x:pet.position.x,z:pet.position.z};
 const requested={x:THREE.MathUtils.clamp(x,MIN_X,MAX_X),z:THREE.MathUtils.clamp(z,MIN_Z,MAX_Z)};
 if(clearPetSegment(startPos,requested)){
   petRoute=[requested];petTarget.set(requested.x,.13,requested.z);
   return true;
 }
 const cols=Math.floor((MAX_X-MIN_X)/GRID)+1,rows=Math.floor((MAX_Z-MIN_Z)/GRID)+1;
 const node=(cx,cz)=>({cx,cz,x:MIN_X+cx*GRID,z:MIN_Z+cz*GRID});
 const nearest=(px,pz)=>[THREE.MathUtils.clamp(Math.round((px-MIN_X)/GRID),0,cols-1),THREE.MathUtils.clamp(Math.round((pz-MIN_Z)/GRID),0,rows-1)];
 const [sx,sz]=nearest(startPos.x,startPos.z),[tx,tz]=nearest(requested.x,requested.z);
 const start=sz*cols+sx,target=tz*cols+tx;
 const parent=new Int32Array(cols*rows).fill(-2);
 const costs=new Float32Array(cols*rows).fill(Infinity);
 const open=[start];parent[start]=-1;costs[start]=0;
 const heuristic=(cx,cz)=>Math.hypot(cx-tx,cz-tz);
 let best=start,bestDist=Infinity,iterations=0;
 // 8 yönlü A*: yalnızca duvar veya mobilya engel olduğunda dolanır.
 while(open.length&&iterations++<cols*rows*4){
   let bestOpenIndex=0,bestF=Infinity;
   for(let i=0;i<open.length;i++){
     const id=open[i],score=costs[id]+heuristic(id%cols,Math.floor(id/cols));
     if(score<bestF){bestF=score;bestOpenIndex=i}
   }
   const id=open.splice(bestOpenIndex,1)[0];
   const cx=id%cols,cz=Math.floor(id/cols),p=node(cx,cz);
   const dist=Math.hypot(p.x-requested.x,p.z-requested.z);
   if(petCellFree(p.x,p.z)&&dist<bestDist){best=id;bestDist=dist}
   if((id===target&&petCellFree(p.x,p.z))||(dist<.35&&clearPetSegment(p,requested))){
     best=id;break;
   }
   for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
     if(!dx&&!dz)continue;
     const nx=cx+dx,nz=cz+dz;
     if(nx<0||nx>=cols||nz<0||nz>=rows)continue;
     const id2=nz*cols+nx,np=node(nx,nz);
     if(!petCellFree(np.x,np.z))continue;
     if(dx&&dz&&!clearPetSegment(p,np))continue;
     const g=costs[id]+Math.hypot(dx,dz);
     if(g>=costs[id2])continue;
     costs[id2]=g;parent[id2]=id;
     if(!open.includes(id2))open.push(id2);
   }
 }
 if(best===start){petRoute=[];return false}
 const path=[];
 for(let id=best;id!==start&&id>=0;id=parent[id]){
   if(id<0||parent[id]===-2)break;
   path.push(node(id%cols,Math.floor(id/cols)));
 }
 path.reverse();
 if(clearPetSegment(path[path.length-1],requested))path.push(requested);
 const route=[];let from=startPos,index=0;
 while(index<path.length){
   let far=index;
   // En son görülebilir rota noktasını seç, ilk engelde durma.
   for(let j=path.length-1;j>=index;j--){
     if(clearPetSegment(from,path[j])){far=j;break}
   }
   if(!clearPetSegment(from,path[far]))break;
   route.push(path[far]);from=path[far];index=far+1;
 }
 petRoute=route;
 if(route.length){const last=route[route.length-1];petTarget.set(last.x,.13,last.z)}
 return route.length>0;
}
const HOLD_MS=350, MOVE_THRESHOLD=12;
const activeTouches=new Map();
let pinchDistance=0,pinchMid=null,blockTapUntilAllUp=false;
function touchDistance(){
 const t=[...activeTouches.values()];
 return t.length<2?0:Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y);
}
function touchMidpoint(){
 const t=[...activeTouches.values()];
 return t.length<2?null:{x:(t[0].x+t[1].x)/2,y:(t[0].y+t[1].y)/2};
}
function floorAtScreen(x,y){
 const pointer={clientX:x,clientY:y};
 point(pointer);
 const out=new THREE.Vector3();
 return ray.ray.intersectPlane(ground,out)?out:null;
}
function panCameraToKeepPoint(before,screen){
 if(!before||!screen)return;
 const after=floorAtScreen(screen.x,screen.y);
 if(!after)return;
 CAMERA_TARGET.x=THREE.MathUtils.clamp(CAMERA_TARGET.x+before.x-after.x,-4.6,4.6);
 CAMERA_TARGET.z=THREE.MathUtils.clamp(CAMERA_TARGET.z+before.z-after.z,-4.1,4.1);
 updateCamera();
}
let gesture=null;
function point(e){
  coords.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);
  ray.setFromCamera(coords,camera);
}
function petAt(e){
  point(e);
  const petHits=ray.intersectObject(petHitbox,false);
  if(!petHits.length)return false;
  const furnitureHits=ray.intersectObjects(furniture,true);
  return !furnitureHits.length||petHits[0].distance<furnitureHits[0].distance+.04;
}
function furnitureAt(e){
  point(e);
  const hits=ray.intersectObjects(furniture,true);
  if(!hits.length)return null;
  let obj=hits[0].object;
  while(obj.parent&&!obj.userData.name)obj=obj.parent;
  return obj.userData.name?obj:null;
}
function groundAt(e,out){
  point(e);
  return ray.ray.intersectPlane(ground,out);
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function overlapsOtherFurniture(f,x,z,rotation=f.rotation.y){
  // Mobilya hem başka mobilyaya hem de canavarın bulunduğu alana girmesin.
  if(f.userData.name==='rug')return false;
  const petTooClose=Math.abs(x-pet.position.x)<1.15 && Math.abs(z-pet.position.z)<1.05;
  if(petTooClose)return true;
  // Basit çarpışma payı: mobilyalar üst üste binmesin
  const own=footprint(f,rotation);
  return furniture.some(other=>{
    if(other===f||other.userData.name==='rug')return false;
    const s=footprint(other);
    return Math.abs(x-other.position.x)<(own[0]+s[0])/2+.12 &&
           Math.abs(z-other.position.z)<(own[1]+s[1])/2+.12;
  });
}
function footprint(f,rotation=f.rotation.y){
 const sizes={bed:[2,1.35],wardrobe:[1.4,.8],chest:[1.1,.8],rug:[3.8,2.7]};
 const [w,d]=sizes[f.userData.name]||[1,1];
 return Math.abs(Math.sin(rotation))>.7?[d,w]:[w,d];
}
function furniturePlacement(f,x,z){
 if(f.userData.name==='rug'){
   const rotation=f.rotation.y;
   const [w,d]=footprint(f,rotation);
   return {x:THREE.MathUtils.clamp(x,-ROOM_HALF_X+w/2+.15,ROOM_HALF_X-w/2-.15),
           z:THREE.MathUtils.clamp(z,-ROOM_HALF_Z+d/2+.15,ROOM_HALF_Z-d/2-.15),rotation};
 }
 let rotation=f.rotation.y;
 const distances=[
   {side:'left',d:Math.max(0,x+ROOM_HALF_X)},
   {side:'right',d:Math.max(0,ROOM_HALF_X-x)},
   {side:'back',d:Math.max(0,z+ROOM_HALF_Z)},
   {side:'front',d:Math.max(0,ROOM_HALF_Z-z)}
 ].sort((a,b)=>a.d-b.d);
 const closest=distances[0];
 // Dolabın geniş gövdesi yüzünden parmağın düştüğü nokta duvardan
 // 1.55 birimden uzakta kalabiliyordu. Sağ duvarda yön bu yüzden eski kalıyordu.
 const snapDistance=f.userData.name==='wardrobe'?2.45:1.55;
 const snapped=closest.d<snapDistance;
 if(snapped){
   if(f.userData.name==='wardrobe'){
     // Kapakların yerel önü +Z'dir. Her duvarda içe dönük sabit açı.
     rotation={back:0,right:-Math.PI/2,front:Math.PI,left:Math.PI/2}[closest.side];
   }else{
     rotation=(closest.side==='left'||closest.side==='right')?Math.PI/2:0;
   }
 }
 const [w,d]=footprint(f,rotation);
 const padding=.14;
 x=THREE.MathUtils.clamp(x,-ROOM_HALF_X+w/2+padding,ROOM_HALF_X-w/2-padding);
 z=THREE.MathUtils.clamp(z,-ROOM_HALF_Z+d/2+padding,ROOM_HALF_Z-d/2-padding);
 if(snapped){
   if(closest.side==='left')x=-ROOM_HALF_X+w/2+padding;
   if(closest.side==='right')x=ROOM_HALF_X-w/2-padding;
   if(closest.side==='back')z=-ROOM_HALF_Z+d/2+padding;
   if(closest.side==='front')z=ROOM_HALF_Z-d/2-padding;
 }
 return {x,z,rotation};
}
function clearHold(){if(gesture?.timer){clearTimeout(gesture.timer);gesture.timer=null}}
function decorationAt(e){
 point(e);
 const visible=wallDecor.filter(d=>d.parent.visible);
 const hits=ray.intersectObjects(visible,true);
 if(!hits.length)return null;
 let obj=hits[0].object;
 while(obj.parent&&!obj.userData.decor)obj=obj.parent;
 return obj.userData.decor?obj:null;
}
function wallPoint(e,decor,out){
 point(e);
 const side=decor.userData.side;
 const axis=(side==='back'||side==='front')?'z':'x';
 const normal=axis==='x'?new THREE.Vector3(1,0,0):new THREE.Vector3(0,0,1);
 const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,decor.position);
 return ray.ray.intersectPlane(plane,out);
}
function visibleWallHit(e){
 point(e);
 let nearest=null,nearestDist=Infinity;
 const defs=[
  {side:'back',axis:'z',value:-4.80,limit:4.65},
  {side:'front',axis:'z',value:4.80,limit:4.65},
  {side:'left',axis:'x',value:-5.30,limit:4.1},
  {side:'right',axis:'x',value:5.30,limit:4.1}
 ];
 for(const w of defs){
   if(!wallParents[w.side].visible)continue;
   const normal=w.axis==='x'?new THREE.Vector3(1,0,0):new THREE.Vector3(0,0,1);
   const origin=w.axis==='x'?new THREE.Vector3(w.value,0,0):new THREE.Vector3(0,0,w.value);
   const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,origin);
   const p=new THREE.Vector3();
   if(!ray.ray.intersectPlane(plane,p))continue;
   const along=w.axis==='x'?p.z:p.x;
   if(Math.abs(along)>w.limit+.25||p.y<.65||p.y>4.0)continue;
   const distance=ray.ray.origin.distanceTo(p);
   if(distance<nearestDist){nearest={side:w.side,u:along,y:p.y};nearestDist=distance}
 }
 return nearest;
}
function moveDecoration(e){
 const d=gesture?.decor;
 if(!d||!gesture.dragging)return;
 const target=visibleWallHit(e);
 if(!target)return;
 // Yeni bir duvara geçişte dokunulan noktayı esas al, aynı duvarda tutma offset'ini koru.
 const changedWall=d.userData.side!==target.side;
 const u=target.u+(changedWall?0:gesture.decorOffset.u);
 const y=target.y+(changedWall?0:gesture.decorOffset.y);
 const side=target.side;
 const nextU=THREE.MathUtils.clamp(u,side==='back'||side==='front'?-4.65:-4.1,side==='back'||side==='front'?4.65:4.1);
 const nextY=THREE.MathUtils.clamp(y,.9,3.65);
 const prior=(side==='back'||side==='front')?d.position.x:d.position.z;
 if(changedWall||Math.abs(nextU-prior)>.001||Math.abs(d.position.y-nextY)>.001){
   setDecorWall(d,side,nextU,nextY);
   if(changedWall){gesture.decorOffset.u=0;gesture.decorOffset.y=0;}
   gesture.changed=true;
 }
}
function moveFurniture(e){
  if(!gesture?.item||!gesture.dragging)return;
  if(!groundAt(e,hit))return;
  const item=gesture.item;
  // Nesnenin ilk tutulduğu yer sabit kalsın; merkeze ani sıçrama olmasın.
  const placement=furniturePlacement(item,hit.x+gesture.offset.x,hit.z+gesture.offset.z);
  if(!overlapsOtherFurniture(item,placement.x,placement.z,placement.rotation)){
    item.position.x=placement.x;item.position.z=placement.z;
    item.rotation.y=placement.rotation;
    gesture.changed=true;petRoute=[];
  }
}
renderer.domElement.addEventListener('pointerdown',e=>{
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{renderer.domElement.setPointerCapture(e.pointerId)}catch{}
  if(activeTouches.size>=2){
    clearHold();
    if(gesture){gesture.canceled=true;gesture.dragging=true;gesture=null}
    blockTapUntilAllUp=true;pinchDistance=touchDistance();pinchMid=touchMidpoint();
    return;
  }
  if(blockTapUntilAllUp||gesture)return;
  const onPet=petAt(e);
  const decor=onPet?null:decorationAt(e);
  const item=onPet||decor?null:furnitureAt(e);
  const start={x:e.clientX,y:e.clientY};
  gesture={id:e.pointerId,start,last:start,item,decor,onPet,armed:false,dragging:false,changed:false,canceled:false,timer:null,
    offset:{x:0,z:0},decorOffset:{u:0,y:0},
    initial:item?{position:item.position.clone(),rotation:item.rotation.y}:null,
    decorInitial:decor?decor.position.clone():null,
    decorOriginalSide:decor?decor.userData.side:null};
  if(decor){
    selectWallDecor(decor);
    const side=decor.userData.side;
    const coordinate=(side==='back'||side==='front')?'x':'z';
    if(wallPoint(e,decor,hit)){
      gesture.decorOffset.u=decor.position[coordinate]-hit[coordinate];
      gesture.decorOffset.y=decor.position.y-hit.y;
    }
  }
  if(item||decor){
    // Yalnızca zemin mobilyasında yer düzlemi offset'i hesaplanır.
    // Duvar dekoru için offset yukarıda ayrı hesaplandı.
    if(item&&groundAt(e,hit)){gesture.offset.x=item.position.x-hit.x;gesture.offset.z=item.position.z-hit.z;}
    const id=e.pointerId;
    gesture.timer=setTimeout(()=>{
      if(gesture&&gesture.id===id&&!gesture.canceled){
        gesture.armed=true;
        say('Taşımak için parmağını kaydır 🪑');
      }
    },HOLD_MS);
  }
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(activeTouches.has(e.pointerId))activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activeTouches.size>=2){
    const next=touchDistance(),mid=touchMidpoint();
    const anchor=pinchMid?floorAtScreen(pinchMid.x,pinchMid.y):null;
    if(next>0&&pinchDistance>0){
      cameraDistance=THREE.MathUtils.clamp(cameraDistance*THREE.MathUtils.clamp(pinchDistance/next,.70,1.3),CAMERA_MIN,CAMERA_MAX);
      updateCamera();
      // Yakınlaştırılan obje ekranda aynı yerde kalır; kaydırmak için iki parmağı birlikte sürükle.
      panCameraToKeepPoint(anchor,mid);
    }
    pinchDistance=next;pinchMid=mid;return;
  }
  if(blockTapUntilAllUp||!gesture||gesture.id!==e.pointerId)return;
  const next={x:e.clientX,y:e.clientY};
  const moved=distance(next,gesture.start);
  if(gesture.item||gesture.decor){
    if(!gesture.armed){
      if(moved>MOVE_THRESHOLD){gesture.canceled=true;clearHold();}
      gesture.last=next;
      return;
    }
    if(!gesture.dragging&&moved>MOVE_THRESHOLD)gesture.dragging=true;
    if(gesture.decor)moveDecoration(e);
    else moveFurniture(e);
  }else{
    if(moved>MOVE_THRESHOLD)gesture.dragging=true;
    if(gesture.dragging){
      const dx=next.x-gesture.last.x;
      cameraAngle-=dx*.0035;
      updateCamera();
    }
  }
  gesture.last=next;
});
function finishPointer(e,cancel=false){
  activeTouches.delete(e.pointerId);
  if(activeTouches.size<2){pinchDistance=0;pinchMid=null;}
  if(blockTapUntilAllUp){if(activeTouches.size===0)blockTapUntilAllUp=false;return}
  if(!gesture||gesture.id!==e.pointerId)return;
  clearHold();
  const g=gesture;gesture=null;
  if(g.decor){
    if(cancel&&g.decorInitial)setDecorWall(g.decor,g.decorOriginalSide,
      g.decorOriginalSide==='back'||g.decorOriginalSide==='front'?g.decorInitial.x:g.decorInitial.z,g.decorInitial.y);
    else if(g.changed){save();say('Duvar dekoru yerleştirildi! 🖼️')}
    else if(!g.canceled)say('Duvar dekorunu taşımak için basılı tut 🖐️');
    return;
  }
  if(g.item){
    if(cancel&&g.initial){g.item.position.copy(g.initial.position);g.item.rotation.y=g.initial.rotation;}
    else if(g.changed){save();say(g.item===rug?'Halı yerleştirildi! ✨':'Mobilya duvara hizalandı! 🪑');}
    else if(!g.canceled&&!g.dragging){
      if(g.item===wardrobe)toggleWardrobe();
      else if(g.item===rug)say('Halıyı ↻ düğmesiyle döndürebilirsin');
      else say('Mobilyayı taşımak için basılı tut 🖐️');
    }
    return;
  }
  if(!cancel&&!g.dragging&&distance({x:e.clientX,y:e.clientY},g.start)<=MOVE_THRESHOLD){
    if(g.onPet||petAt(e)){reactToPet();return}
    if(isSleeping()){say('Mochi şu an dinleniyor 🌙');return}
    point(e);
    const floorHits=ray.intersectObject(floor,false);
    if(floorHits.length){
      const dest=floorHits[0].point;
      const ok=planPetRoute(dest.x,dest.z);
      say(ok?'Mochi geliyor! 🐾':'Mochi oraya ulaşamıyor 🪑');
    }
  }
}
renderer.domElement.addEventListener('pointerup',e=>finishPointer(e));
renderer.domElement.addEventListener('pointercancel',e=>finishPointer(e,true));
renderer.domElement.addEventListener('lostpointercapture',e=>finishPointer(e,true));
function isSleeping(){const n=new Date();const h=n.getHours()+n.getMinutes()/60;return h>=22.5||h<7.5}
function updateClock(){const sleeping=isSleeping();document.getElementById('clock').textContent=sleeping?'🌙':'☀️';document.getElementById('mood').textContent=sleeping?'Mochi uyuyor':'Mochi mutlu';}
updateClock();
let lastTime=0,crawlBlend=0,previousPetX=pet.position.x,previousPetZ=pet.position.z;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;
  const sleeping=isSleeping();
  let moving=false;
  if(!sleeping&&petRoute.length){
    const wp=petRoute[0],dx=wp.x-pet.position.x,dz=wp.z-pet.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<.035)petRoute.shift();
    else{
      const speed=babyStage==='baby'?.95:1.25;
      const step=Math.min(dist,dt*speed);
      const nx=pet.position.x+dx/dist*step,nz=pet.position.z+dz/dist*step;
      if(petCellFree(nx,nz)){
        pet.position.x=nx;pet.position.z=nz;moving=true;
        // Yüzünün gittiği yöne dönmesini sağla.
        const facing=Math.atan2(dx,dz);
        pet.rotation.y+=Math.atan2(Math.sin(facing-pet.rotation.y),Math.cos(facing-pet.rotation.y))*Math.min(1,dt*8);
      }else petRoute=[];
    }
  }
  // Yumuşak emekleme: ritim gerçek ilerlenen mesafeden türetilir.
  const movedDistance=Math.hypot(pet.position.x-previousPetX,pet.position.z-previousPetZ);
  previousPetX=pet.position.x;previousPetZ=pet.position.z;
  crawlBlend=THREE.MathUtils.damp(crawlBlend,moving?1:0,7,dt);
  stepCycle+=movedDistance*8;
  const reactionTime=t-petReactionStart,reacting=!sleeping&&reactionTime>=0&&reactionTime<750;
  const jump=reacting&&petReactionKind==='jump'?Math.sin(Math.PI*reactionTime/750)*.28:0;
  const tilt=reacting&&petReactionKind==='tilt'?Math.sin(Math.PI*reactionTime/750)*.19:0;
  const crawlBounce=crawlBlend*.009*(1-Math.cos(stepCycle*2));
  pet.position.y=.13+(sleeping?0:crawlBounce+.012*Math.sin(t*.002))+jump;
  pet.rotation.z=tilt;
  if(babyStage==='baby'){
    // Çapraz kollar sırayla öne ve arkaya gider; zeminle temas kontrollüdür.
    const stride=.13*crawlBlend;
    for(const limb of crawlLimbs){
      const phase=stepCycle+(limb.side*limb.front>0?0:Math.PI);
      const reach=Math.sin(phase)*stride;
      limb.joint.position.z=limb.front*.39+reach;
      limb.joint.position.y=.25+Math.max(0,Math.cos(phase))*.045*crawlBlend;
      limb.joint.rotation.x=reach*.7;
    }
    bodyRig.rotation.x=.015*crawlBlend*Math.sin(stepCycle*2);
    bodyRig.rotation.z=.016*crawlBlend*Math.sin(stepCycle);
    headRig.rotation.x=crawlBlend*(-.01+.018*Math.sin(stepCycle*2))+(1-crawlBlend)*.015*Math.sin(t*.0017);
    headRig.rotation.z=tilt*.35;
    babyTail.rotation.y=crawlBlend*.17*Math.sin(stepCycle)+(1-crawlBlend)*.1*Math.sin(t*.002);
  }
  wardrobeDoorProgress=THREE.MathUtils.damp(wardrobeDoorProgress,wardrobeOpen?1:0,8,dt);
  leftDoorPivot.rotation.y=-1.35*wardrobeDoorProgress;
  rightDoorPivot.rotation.y=1.35*wardrobeDoorProgress;
  // Kamerayı Mochi yürürken otomatik yeniden merkezleme: KAPALI.
  updateCamera();
  // Rastgele göz kırpma ve dokunmaya özel göz kırpma
  if(t>nextBlink){blinkAt=t;nextBlink=t+2300+Math.random()*3200}
  const blinkElapsed=t-blinkAt;
  const blinking=blinkElapsed>=0&&blinkElapsed<165;
  const eyeHeight=blinking ? .12 : 1;
  for(const eye of [leftEye,rightEye,leftShine,rightShine])eye.scale.y=eyeHeight;
  // Dokunma tepkisi büyük ekranda da net görülsün.
  pet.scale.setScalar(reacting?1+.12*Math.sin(Math.PI*reactionTime/750):1);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();placeCamera();renderer.setSize(innerWidth,innerHeight)});refresh();
